<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fundo super elegante e moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gradiente de destaque para a mira e ondas de rádio (Azul Horizonte) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Sombra projetada do logótipo para dar efeito 3D -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. BASE DO ÍCONE (Squircle estilo iOS/Android moderno) -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- 2. DETALHE DE REDE/MIRA NO FUNDO (Representa mapeamento/geoprocessamento) -->
  <g opacity="0.08">
    <circle cx="256" cy="256" r="220" stroke="#ffffff" stroke-width="2" fill="none" />
    <circle cx="256" cy="256" r="160" stroke="#ffffff" stroke-width="1.5" fill="none" />
    <circle cx="256" cy="256" r="100" stroke="#ffffff" stroke-width="1" fill="none" />
    <line x1="256" y1="20" x2="256" y2="492" stroke="#ffffff" stroke-width="2" />
    <line x1="20" y1="256" x2="492" y2="256" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- 3. MIRA DE LOCALIZAÇÃO BRILHANTE (Coração do Mapeamento) -->
  <g transform="translate(256, 175)" filter="url(#glow)" opacity="0.85">
    <circle cx="0" cy="0" r="12" fill="#3b82f6" />
    <circle cx="0" cy="0" r="28" stroke="#3b82f6" stroke-width="3" fill="none" opacity="0.5" />
    <!-- Sombra de dispersão do GPS -->
    <path d="M-40,0 L-20,0 M20,0 L40,0 M0,-40 L0,-20 M0,20 L0,40" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 4. LOGÓTIPO OFICIAL "VOZ" CENTRALIZADO COM SOMBRA 3D -->
  <g transform="translate(56, 160)" filter="url(#dropShadow)">
    <!-- Letra V -->
    <path 
      d="M60 50 L105 160 L150 50" 
      stroke="#fdfcf0" 
      stroke-width="22" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
    <!-- Letra O (A Ponte de Comunicação de Horizonte) -->
    <g transform="translate(160, 40)">
      <path 
        d="M10 100 A 70 70 0 0 1 150 100" 
        stroke="#3b82f6" 
        stroke-width="18" 
        stroke-linecap="round" 
      />
      <path 
        d="M15 125 Q 80 105 145 125" 
        stroke="#fdfcf0" 
        stroke-width="8" 
        stroke-linecap="round" 
      />
      <path 
        d="M25 145 Q 80 125 135 145" 
        stroke="#fdfcf0" 
        stroke-width="5" 
        stroke-linecap="round" 
      />
    </g>

    <!-- Letra Z -->
    <path 
      d="M320 50 H380 L320 160 H380" 
      stroke="#fdfcf0" 
      stroke-width="22" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Subtítulo "da comunidade" com tipografia e espaçamento premium -->
  <text 
    x="256" 
    y="390" 
    fill="#fdfcf0" 
    font-family="sans-serif" 
    font-size="16" 
    font-weight="900" 
    letter-spacing="8" 
    text-anchor="middle"
    opacity="0.9"
  >DA COMUNIDADE</text>

  <!-- Detalhe decorativo no canto representando a bandeira/força tecnológica de Horizonte -->
  <rect x="226" y="475" width="60" height="6" rx="3" fill="#3b82f6" opacity="0.6" />
</svg>